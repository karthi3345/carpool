{% extends "base.html" %}
{% load static %}

{% block title %}Profile &amp; Account | TamizhPayanam{% endblock %}

{% block extra_head %}
<style>
  :root {
    --tp-dark: #071739;
    --tp-blue: #0066FF;
    --tp-bg: #F8FAFC;
    --tp-border: #E2E8F0;
  }

  body {
    background-color: var(--tp-bg);
  }

  .profile-menu-container {
    max-width: 580px;
    margin: 36px auto 80px;
    padding: 0 20px;
  }

  /* Top Right Action Pill (Offer a ride + Flag + Profile Avatar badge) */
  .profile-top-appbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .btn-offer-ride {
    border: 2px solid #0066FF;
    color: #0066FF;
    background: #FFFFFF;
    font-size: 14.5px;
    font-weight: 800;
    padding: 8px 22px;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-offer-ride:hover {
    background: #0066FF;
    color: #FFFFFF;
  }

  .profile-badge-avatar {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94A3B8;
  }
  .notification-count-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #DC2626;
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 800;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #FFFFFF;
  }

  /* Main Menu Card matching exact Reference d5c01b17.png */
  .profile-menu-card {
    background: #FFFFFF;
    border: 1.5px solid #E2E8F0;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }

  .menu-list-wrap {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .menu-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    text-decoration: none;
    color: #071739;
    font-size: 16px;
    font-weight: 800;
    border-bottom: 1px solid #F1F5F9;
    transition: background 0.15s ease;
  }
  .menu-item-row:last-child {
    border-bottom: none;
  }
  .menu-item-row:hover {
    background: #F8FAFC;
  }

  .menu-item-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .menu-item-icon {
    width: 26px;
    height: 26px;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .menu-item-chevron {
    color: #64748B;
    font-size: 18px;
    font-weight: 600;
  }

  .inbox-pill-count {
    background: #DC2626;
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 800;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 6px;
  }
</style>
{% endblock %}

{% block content %}
<div class="profile-menu-container">

  <!-- Top bar matching screenshot d5c01b17.png -->
  <div class="profile-top-appbar">
    <!-- Search Icon -->
    <a href="/rides/search/" style="color: #0066FF; font-size: 20px; text-decoration: none;" title="Search Rides">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </a>

    <!-- Offer a ride button -->
    <a href="/rides/publish/" class="btn-offer-ride">
      Offer a ride
    </a>

    <!-- Flag icon (India) -->
    <span style="font-size: 22px; cursor: pointer;" title="India (Tamil Nadu)">🇮🇳</span>

    <!-- Profile Avatar with badge -->
    <div class="profile-badge-avatar" title="{{ user.username|default:'User' }}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span class="notification-count-badge">3</span>
    </div>
  </div>

  <!-- Menu Card matching exact image items -->
  <div class="profile-menu-card">
    <div class="menu-list-wrap">
      
      <!-- 1. Your rides -->
      <a href="/rides/my-rides/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- Road / Carpool Two Curves Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20a6 6 0 0 0-6-6 6 6 0 0 0-6 6"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span>Your rides</span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

      <!-- 2. Inbox (3) -->
      <a href="/messages/list/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- Chat bubble Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <span>Inbox <span class="inbox-pill-count">3</span></span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

      <!-- 3. Profile -->
      <a href="/accounts/profile/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- User in circle Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
          </div>
          <span>Profile</span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

      <!-- 4. Transfers -->
      <a href="/payments/history/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- Two coins / Transfers Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M6 12h.01M18 12h.01"></path>
            </svg>
          </div>
          <span>Transfers</span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

      <!-- 5. Payments & refunds -->
      <a href="/payments/history/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- Bank / Pillars Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 3l9 7H3l9-7z"></path>
            </svg>
          </div>
          <span>Payments &amp; refunds</span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

      <!-- 6. Log out -->
      <a href="/accounts/logout/" class="menu-item-row">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <!-- Circle with X Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          </div>
          <span>Log out</span>
        </div>
        <span class="menu-item-chevron">&rsaquo;</span>
      </a>

    </div>
  </div>

</div>
{% endblock %}
