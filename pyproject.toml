[project]
name = "carpool-platform"
version = "1.0.0"
description = "TamizhPayanam - Intercity Carpooling Platform across Tamil Nadu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "django-celery-results>=2.5.1",
    "django-environ>=0.11.2",
    "Pillow>=10.0.0",
    "razorpay>=1.4.1",
    "whitenoise>=6.6.0",
    "dj-database-url>=2.1.0",
    "cloudinary>=1.40.0",
    "django-cloudinary-storage>=0.3.0",
]

[tool.vercel]
entrypoint = "carpool_platform.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput"
